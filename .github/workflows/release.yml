name: Build and release

# Pull requests run the tests only. A `v*` tag (or a manual run with a tag) also builds the release
# binaries for every target and publishes them as a GitHub release. A push to main builds the same
# binaries and publishes them as the rolling `dev` prerelease (assets named scriber-dev-<target>).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}
  CARGO_TERM_COLOR: always
  # Headers egui/eframe (winit, wgpu, glow, fontconfig) build against on Linux.
  LINUX_DEPS: >-
    pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
    libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked

  # Runs alongside the tests; the release job waits for both.
  build:
    if: ${{ inputs.tag || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on the Apple Silicon runner; GitHub's Intel macOS runners are being retired.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="scriber-$TAG-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then bin=scriber.exe; else bin=scriber; fi
          mkdir pkg dist
          cp "target/${{ matrix.target }}/release/$bin" pkg/
          for f in LICENSE README.md; do
            if [ -f "$f" ]; then cp "$f" pkg/; fi
          done
          if [ "$RUNNER_OS" = Windows ]; then
            asset="$name.zip"
            (cd pkg && 7z a -tzip "../dist/$asset" .)
          else
            asset="$name.tar.gz"
            tar -czf "dist/$asset" -C pkg .
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: ${{ inputs.tag || startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Moves the `dev` tag to this commit and replaces the prerelease. Never marked latest, so the
  # install scripts and the Releases page keep pointing at the newest `v*` release.
  dev-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create dev dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Development build (${GITHUB_SHA::7})" \
            --notes "Unstable build of $GITHUB_SHA on main, replaced on every push. Not signed. For a stable version use the latest release."
        env:
          GH_TOKEN: ${{ github.token }}
