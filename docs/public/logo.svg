  </defs>
  <rect width="256" height="256" rx="56" fill="url(#wood)"/>
  <rect x="18" y="18" width="220" height="220" rx="42" fill="none" stroke="#4a2c16" stroke-width="3" opacity="0.3"/>
  <path d="M186 56H110a36 36 0 0 0 0 72h36a36 36 0 0 1 0 72H70" fill="none" stroke="#7a4a24" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
