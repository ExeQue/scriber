      <stop offset="0" stop-color="#e2c08e"/>
      <stop offset="1" stop-color="#cfa66f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
