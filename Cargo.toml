[package]
name = "scriber"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "2D CAD for laser cutters, drivable by AI agents over MCP"
license = "MIT"
repository = "https://github.com/ExeQue/scriber"

[dependencies]
anyhow = "1.0.105"
parking_lot = "0.12.5"
base64 = "0.23.1"
cavalier_contours = "0.9.0"
dirs = "7.0.0"
dxf = "=0.6.2"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
lyon_tessellation = "1.0.23"
resvg = "0.50.0"
rfd = "0.18.0"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
sha2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "sync", "time"] }
toml_edit = "0.25.21"
skrifa = "0.49.0"
svgtypes = "0.16.2"
tower-service = "0.3"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.29.3", features = ["v4"] }
zip = "9.8.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

# Dependencies (egui, the renderer, usvg, …) are slow unoptimised; build them optimised even in
# debug builds so the editor stays smooth while developing. Our own code keeps fast compiles.
[profile.dev.package."*"]
opt-level = 3

# cavalier_contours' debug assertions check its slices with a tolerance tighter than its own maths:
# an offset that shrinks a stem to exactly nothing (a 0.159 mm stem by -0.08 mm) trips one and
# panics, where a release build drops the stem. Debug builds behave as release builds do.
[profile.dev.package.cavalier_contours]
debug-assertions = false

[profile.dev]
opt-level = 1
